<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon catalogue</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #171717;
      color: white;
      padding: 25px;
      text-align: center;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px #00000012;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h2 { font-size: 18px; }
    .price { font-weight: bold; font-size: 19px; }

    .product a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    #message { text-align: center; }
  </style>
</head>

<body>
  <header>
  <h1>Mon catalogue</h1>
  <p>Découvre tous nos produits</p>
</header>

<main>
  <h2>Nos produits</h2>
  <p id="message">Chargement des produits...</p>
  <div id="products"></div>
</main>

<script>
async function loadProducts() {
  const container = document.getElementById("products");
  const message = document.getElementById("message");

  const { data, error } = await supabaseClient
    .from("produits")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    message.textContent = "Erreur de chargement des produits.";
    return;
  }

  container.replaceChildren();

  if (!data || data.length === 0) {
    message.textContent = "Aucun produit pour le moment.";
    return;
  }

  message.textContent = "";

  data.forEach(product => {
    const card = document.createElement("article");
    card.className = "product";

    if (product.image_url) {
      const img = document.createElement("img");
      img.src = product.image_url;
      img.alt = product.nom || "Produit";
      img.loading = "lazy";
      card.appendChild(img);
    }

    const name = document.createElement("h2");
    name.textContent = product.nom;
    card.appendChild(name);

    const category = document.createElement("p");
    category.textContent = product.categorie || "";
    card.appendChild(category);

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = Number(product.prix).toFixed(2) + " €";
    card.appendChild(price);

    if (product.lien_original) {
      const link = document.createElement("a");
      link.href = product.lien_original;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Voir le produit";
      card.appendChild(link);
    }

    container.appendChild(card);
  });
}

loadProducts();
</script>

</body>
</html>
